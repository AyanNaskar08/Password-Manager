<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First-Time Setup - PassVault</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-icon"><i class="fa-solid fa-vault"></i></div>
            <h1>Initialize Vault</h1>
            <p class="subtitle">Create a master password. This password will encrypt all your saved credentials. Do not lose it!</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="flash-messages">
                        {% for category, message in messages %}
                            <div class="flash {{ category }}">{{ message }}</div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('setup') }}" method="POST">
                <div class="form-group">
                    <label for="master_password">Master Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" id="master_password" name="master_password" required minlength="6" placeholder="At least 6 characters">
                        <button type="button" class="toggle-password" onclick="toggleFormPassword('master_password')"><i class="fa-regular fa-eye"></i></button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="confirm_password">Confirm Master Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" id="confirm_password" name="confirm_password" required placeholder="Repeat Master Password">
                        <button type="button" class="toggle-password" onclick="toggleFormPassword('confirm_password')"><i class="fa-regular fa-eye"></i></button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-full mt-4"><i class="fa-solid fa-shield-halved"></i> Create Vault</button>
            </form>
        </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
